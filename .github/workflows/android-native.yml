name: Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "plugins/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "babel.config.js"
      - "pnpm-lock.yaml"
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_VERSION: "22"
      PNPM_VERSION: "9.12.0"
      GRADLE_VERSION: "8.14.3"
      GRADLE_OPTS: >-
        -Xmx2048m
        -XX:MaxMetaspaceSize=512m
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:+UseG1GC
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.vfs.watch=false
        -Dkotlin.compiler.execution.strategy=in-process
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          tail -n 20 /tmp/sdk-licenses.log || true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          sdkmanager --list_installed | head -40

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile --prefer-offline; then
            echo "::warning::pnpm-lock.yaml out of sync with package.json — regenerating once"
            pnpm install --no-frozen-lockfile --prefer-offline
            echo "Lockfile drift detected. Commit an updated pnpm-lock.yaml from a local pnpm install."
            git diff --stat pnpm-lock.yaml || true
          fi

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test
        continue-on-error: false

      - name: Lint (non-blocking for APK)
        run: pnpm lint
        continue-on-error: true

      - name: Verify Expo configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pnpm exec expo config --type public --json > .expo-config.json
          node <<'NODE'
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync(".expo-config.json", "utf8"));
          const pkg = c.android?.package;
          const version = c.version;
          if (!pkg || typeof pkg !== "string") throw new Error("Missing android.package");
          if (!version) throw new Error("Missing app version");
          console.log(`Expo config OK: name=${c.name} version=${version} package=${pkg}`);
          fs.writeFileSync(".expo-build-meta.env", `APP_VERSION=${version}\nAPP_PACKAGE=${pkg}\n`);
          NODE
          cat .expo-build-meta.env >> "$GITHUB_ENV"

      - name: Preflight Babel config (no duplicate class-feature plugins)
        run: |
          set -euo pipefail
          node <<'NODE'
          const configFactory = require("./babel.config.js");
          const config = typeof configFactory === "function"
            ? configFactory({ cache: () => undefined })
            : configFactory;
          const plugins = config.plugins || [];
          const names = plugins.map((p) => (Array.isArray(p) ? String(p[0]) : String(p)));
          console.log("Babel plugins:", names.join(", ") || "(none)");
          const banned = names.filter((n) =>
            /transform-(class-properties|private-methods|private-property-in-object)/.test(n)
          );
          if (banned.length) {
            throw new Error(
              "Do not register class-feature Babel plugins in babel.config.js; " +
              "babel-preset-expo already enables them. Duplicates cause Hermes loose-mode failures. Found: " +
              banned.join(", ")
            );
          }
          const last = names[names.length - 1] || "";
          if (!/worklets\/plugin|reanimated\/plugin/.test(last)) {
            console.warn("Warning: expected react-native-worklets/plugin (or reanimated) last; got:", last);
          }
          console.log("Babel preflight OK (no duplicate class-feature plugins)");
          NODE

      - name: Generate native Android project
        run: |
          set -euo pipefail
          rm -rf android/app/build android/build android/.gradle || true
          pnpm exec expo prebuild --platform android --no-install --clean
          test -d android
          test -f android/gradlew || test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Harden Gradle wrapper (properties + jar + scripts)
        working-directory: android
        run: |
          set -euo pipefail

          mkdir -p gradle/wrapper

          PROPS="gradle/wrapper/gradle-wrapper.properties"
          if [ ! -s "$PROPS" ]; then
            echo "Writing gradle-wrapper.properties for Gradle ${GRADLE_VERSION}"
            printf '%s\n' \
              "distributionBase=GRADLE_USER_HOME" \
              "distributionPath=wrapper/dists" \
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              "networkTimeout=60000" \
              "validateDistributionUrl=true" \
              "zipStoreBase=GRADLE_USER_HOME" \
              "zipStorePath=wrapper/dists" \
              > "$PROPS"
          else
            if ! grep -q 'networkTimeout=' "$PROPS"; then
              echo "networkTimeout=60000" >> "$PROPS"
            fi
          fi

          GRADLE_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$PROPS" | head -1 | sed 's/gradle-//')
          GRADLE_VER="${GRADLE_VER:-$GRADLE_VERSION}"
          echo "Gradle wrapper version: ${GRADLE_VER}"
          cat "$PROPS"

          JAR="gradle/wrapper/gradle-wrapper.jar"
          need_jar=0
          if [ ! -s "$JAR" ]; then
            need_jar=1
          elif ! unzip -t "$JAR" >/dev/null 2>&1; then
            echo "Existing gradle-wrapper.jar failed integrity check"
            need_jar=1
          fi

          download_jar() {
            local ver="$1"
            local out="$2"
            local tmp
            tmp="$(mktemp)"
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
                -o "$tmp" \
                "https://github.com/gradle/gradle/raw/v${ver}/gradle/wrapper/gradle-wrapper.jar"; then
              if unzip -t "$tmp" >/dev/null 2>&1; then
                mv -f "$tmp" "$out"
                return 0
              fi
            fi
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
                -o "$tmp" \
                "https://services.gradle.org/distributions/gradle-${ver}-bin.zip"; then
              if unzip -p "$tmp" "gradle-${ver}/lib/plugins/gradle-wrapper-${ver}.jar" > "$out" 2>/dev/null \
                || unzip -p "$tmp" "gradle-${ver}/lib/plugins/gradle-wrapper-${ver}-*.jar" > "$out" 2>/dev/null \
                || unzip -p "$tmp" "**/gradle-wrapper-*.jar" > "$out" 2>/dev/null; then
                rm -f "$tmp"
                if [ -s "$out" ] && unzip -t "$out" >/dev/null 2>&1; then
                  return 0
                fi
              fi
            fi
            rm -f "$tmp"
            return 1
          }

          if [ "$need_jar" = "1" ]; then
            echo "Downloading gradle-wrapper.jar for ${GRADLE_VER}..."
            if ! download_jar "$GRADLE_VER" "$JAR"; then
              echo "ERROR: could not obtain a valid gradle-wrapper.jar"
              ls -la gradle/wrapper/ || true
              exit 1
            fi
          fi

          if ! unzip -t "$JAR" >/dev/null 2>&1; then
            echo "ERROR: gradle-wrapper.jar still invalid after download"
            file "$JAR" || true
            ls -la gradle/wrapper/
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "Generating gradlew scripts via Gradle ${GRADLE_VER}"
            if ! command -v gradle >/dev/null 2>&1; then
              curl -fsSL --retry 3 -o /tmp/gradle-bin.zip \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
              unzip -q /tmp/gradle-bin.zip -d /tmp
              export PATH="/tmp/gradle-${GRADLE_VER}/bin:$PATH"
            fi
            gradle wrapper --gradle-version "$GRADLE_VER" --no-daemon
          fi

          chmod +x gradlew
          ./gradlew --version --no-daemon --console=plain | tee /tmp/gradle-version.txt
          ls -lh gradle/wrapper/
          echo "Gradle wrapper hardened and verified."

      - name: CI Gradle property overrides
        working-directory: android
        run: |
          set -euo pipefail
          cat >> gradle.properties <<'PROPS'

          # --- CI overrides (android-native.yml) ---
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.caching=true
          org.gradle.configureondemand=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          android.enableJetifier=true
          PROPS
          echo "---- gradle.properties (tail) ----"
          tail -n 25 gradle.properties

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Build release APK (assembleRelease)
        working-directory: android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            -PreactNativeArchitectures=arm64-v8a \
            assembleRelease
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "First assembleRelease failed (exit $status). Cleaning and retrying once..."
            ./gradlew --no-daemon --stop || true
            rm -rf app/build build .gradle || true
            ./gradlew --no-daemon --stacktrace --console=plain \
              -PreactNativeArchitectures=arm64-v8a \
              assembleRelease
          fi

      - name: Verify APK and write provenance
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$APK" ]; then
            ALT=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1 || true)
            if [ -n "${ALT:-}" ]; then
              echo "Using alternate APK path: $ALT"
              mkdir -p android/app/build/outputs/apk/release
              cp -f "$ALT" "$APK"
            fi
          fi
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex' >/dev/null
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || echo "apksigner warnings ignored for debug-signed APK"
          fi
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "build_system=Gradle"
            echo "profile=release"
            echo "version=${APP_VERSION:-unknown}"
            echo "package=${APP_PACKAGE:-unknown}"
            echo "signing=debug-keystore-testing-only"
            echo "gradle=${GRADLE_VERSION}"
            stat -c 'size_bytes=%s' "$APK"
          } | tee android/app/build/outputs/apk/release/build-info.txt
          ls -lh "$APK"

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-chile-glass-native-${{ env.APP_VERSION }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 14
