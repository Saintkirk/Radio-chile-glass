name: Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "plugins/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_VERSION: "22"
      PNPM_VERSION: "9.12.0"
      GRADLE_VERSION: "8.14.3"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify JavaScript project
        run: pnpm check && pnpm test && pnpm lint

      - name: Verify Expo configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pnpm exec expo config --type public --json > .expo-config.json
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync(".expo-config.json", "utf8"));
            if (c.version !== "1.0.2") throw new Error(`Unexpected app version: ${c.version}`);
            if (c.android?.package !== "com.app.radiochileglass") throw new Error("Unexpected Android package");
            console.log(`Expo config OK: ${c.name} ${c.version} ${c.android.package}`);
          '

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Ensure complete Gradle wrapper
        working-directory: android
        run: |
          set -euo pipefail

          # Always ensure the directory exists
          mkdir -p gradle/wrapper

          # Restore or create gradle-wrapper.properties if missing
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Creating gradle-wrapper.properties for Gradle ${GRADLE_VERSION}"
            cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          # Read version from properties (never delete the file)
          GRADLE_VER=$(grep -oP 'gradle-\K[0-9.]+' gradle/wrapper/gradle-wrapper.properties || echo "${GRADLE_VERSION}")
          echo "Using Gradle wrapper version: ${GRADLE_VER}"

          # Download official wrapper JAR only if missing or empty
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar for ${GRADLE_VER}..."
            # Primary source: official Gradle GitHub tag
            curl -fsSL --retry 3 --retry-delay 2 \
              -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}/gradle/wrapper/gradle-wrapper.jar" \
            || {
              echo "Primary download failed, trying services.gradle.org..."
              # Fallback: extract from the distribution zip (more reliable long-term)
              TMP_ZIP=$(mktemp)
              curl -fsSL --retry 3 --retry-delay 2 \
                -o "${TMP_ZIP}" \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
              unzip -p "${TMP_ZIP}" "gradle-${GRADLE_VER}/lib/plugins/gradle-wrapper-*.jar" > gradle/wrapper/gradle-wrapper.jar 2>/dev/null \
                || unzip -p "${TMP_ZIP}" "**/gradle-wrapper-*.jar" > gradle/wrapper/gradle-wrapper.jar
              rm -f "${TMP_ZIP}"
            }
          fi

          # Validate the JAR is a real zip/jar (not empty or HTML error page)
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "ERROR: gradle-wrapper.jar is invalid or corrupted"
            ls -la gradle/wrapper/
            file gradle/wrapper/gradle-wrapper.jar || true
            exit 1
          fi

          chmod +x gradlew
          ls -lh gradle/wrapper/
          echo "Gradle wrapper is ready."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build signed release APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify APK and write provenance
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --verbose "$APK"; fi
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "build_system=Gradle"
            echo "profile=release"
            echo "version=1.0.2"
            echo "package=com.app.radiochileglass"
            echo "signing=debug-keystore-testing-only"
            stat -c 'size_bytes=%s' "$APK"
          } | tee android/app/build/outputs/apk/release/build-info.txt

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-chile-glass-native-v1.0.2-${{ github.sha }}
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 14
