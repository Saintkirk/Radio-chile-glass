name: Android APK (Native Gradle)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "plugins/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "android/**"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_VERSION: "22"
      PNPM_VERSION: "9.12.0"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          pnpm store prune
          rm -rf node_modules pnpm-lock.yaml
          pnpm install

      - name: Clean Gradle cache
        run: cd android && ./gradlew clean && cd ..

      - name: Verify JavaScript project
        run: pnpm check && pnpm test && pnpm lint

      - name: Verify Expo configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pnpm exec expo config --type public --json > .expo-config.json
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync(".expo-config.json","utf8")); if(c.version !== "1.0.2") throw new Error(`Unexpected app version: ${c.version}`); if(c.android?.package !== "com.app.radiochileglass") throw new Error("Unexpected Android package"); console.log(`Expo config OK: ${c.name} ${c.version} ${c.android.package}`);'

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Ensure Gradle wrapper exists
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR missing or empty, regenerating..."
            rm -rf gradle/wrapper
            mkdir -p gradle/wrapper
            # Download gradle-wrapper.jar from official Gradle distribution
            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\).*/\1/')
            echo "Downloading Gradle wrapper for version $GRADLE_VERSION"
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" || \
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build signed release APK with Gradle
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease

      - name: Verify APK and write provenance
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --verbose "$APK"; fi
          sha256sum "$APK" | tee android/app/build/outputs/apk/release/SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "build_system=Gradle"
            echo "profile=release"
            echo "version=1.0.2"
            echo "package=com.app.radiochileglass"
            echo "signing=debug-keystore-testing-only"
            stat -c 'size_bytes=%s' "$APK"
          } | tee android/app/build/outputs/apk/release/build-info.txt

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-chile-glass-native-v1.0.2-${{ github.sha }}
          path: android/app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 14
