name: Apply playback UX phases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write unified playback files
        run: python3 scripts/decode-playback-ux.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/player-utils.ts app/radio components/cover-flow-carousel.tsx components/persistent-mini-player.tsx components/ui/icon-symbol.tsx tests/station-playback-phase.test.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(ux): unify playback phases across dial, mini-player and cover flow"
          git push origin HEAD:main
