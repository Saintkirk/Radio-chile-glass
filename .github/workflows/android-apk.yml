name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production-apk
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROFILE: ${{ github.event_name == 'push' && 'production-apk' || inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify project before build
        run: pnpm check && pnpm test && pnpm lint

      - name: Setup EAS CLI
        run: pnpm dlx eas-cli@latest --version

      - name: Build APK with EAS
        env:
          EAS_NO_VCS: "1"
          CI: "1"
        run: |
          set -euo pipefail
          rm -f .eas-build.json
          pnpm dlx eas-cli@latest build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json > .eas-build.json
          test -s .eas-build.json

      - name: Download APK
        run: |
          set -euo pipefail
          mkdir -p dist/android
          node scripts/download-eas-artifact.mjs .eas-build.json dist/android/Radio-Chile-Glass.apk
          test -s dist/android/Radio-Chile-Glass.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: radio-chile-glass-${{ env.EAS_PROFILE }}-${{ github.sha }}
          path: dist/android/Radio-Chile-Glass.apk
          if-no-files-found: error
          retention-days: 14
