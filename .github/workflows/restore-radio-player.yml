name: Restore radio-player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore lib/radio-player.tsx and apply live-stream fix
        run: |
          set -euo pipefail
          # Last known good content before accidental empty push
          git show 15572808c5aca0b9bcaf6db0b9548b3d5276b038:lib/radio-player.tsx > lib/radio-player.tsx
          git show 15572808c5aca0b9bcaf6db0b9548b3d5276b038:lib/player-utils.ts > lib/player-utils.ts

          python3 <<'PY'
          from pathlib import Path

          utils = Path("lib/player-utils.ts").read_text()
          old_u = '''/** Only finish the connection state after the native player is ready and audible. */\nexport function isPlaybackConfirmed(status: PlaybackStatusSnapshot): boolean {\n  return status.playing === true && status.isLoaded === true && status.isBuffering !== true;\n}'''
          new_u = '''/**\n * Live radio streams often report isBuffering=true in short bursts while\n * already audible. Treat playing+loaded as confirmed; buffering alone must\n * not drop the "en vivo" / isPlaying UI or tear down the player.\n */\nexport function isPlaybackConfirmed(status: PlaybackStatusSnapshot): boolean {\n  return status.playing === true && status.isLoaded !== false;\n}'''
          if old_u not in utils:
              raise SystemExit("player-utils pattern missing")
          Path("lib/player-utils.ts").write_text(utils.replace(old_u, new_u))

          rp = Path("lib/radio-player.tsx").read_text()
          old = '''          if (confirmed) {\n            nativePlaybackConfirmed = true;\n            failedRadioUntilRef.current.delete(radio.id);\n            setIsPlaying(true);\n            updateNativeMediaState(true);\n          } else if (!status.playing && !status.isBuffering && !playbackIntentRef.current) {\n            setIsPlaying(false);\n            updateNativeMediaState(false);\n          }\n          if (confirmed) {\n            const successTime = Date.now();\n            logPerformance({ \n              event: 'playRadio_success', \n              timestamp: successTime, \n              radioId: radio.id, \n              success: true,\n              duration: successTime - startTime \n            });\n            if (crossfadeStartedRequestRef.current !== requestId) {\n              crossfadeStartedRequestRef.current = requestId;\n              startCrossfade(outgoingPlayer, candidate as ReturnType<typeof createAudioPlayer>, requestId);\n            }\n            playbackIntentRef.current = false;\n            if (startupTimeoutRef.current) {\n              clearTimeout(startupTimeoutRef.current);\n              startupTimeoutRef.current = null;\n            }\n            setPlaybackError(null);\n            setIsLoading(false);\n            setNativeMediaSession(lockScreenMetadata(radio), true);\n          }'''
          new = '''          if (confirmed) {\n            nativePlaybackConfirmed = true;\n            failedRadioUntilRef.current.delete(radio.id);\n            setIsPlaying(true);\n            updateNativeMediaState(true);\n            const successTime = Date.now();\n            logPerformance({\n              event: 'playRadio_success',\n              timestamp: successTime,\n              radioId: radio.id,\n              success: true,\n              duration: successTime - startTime,\n            });\n            if (crossfadeStartedRequestRef.current !== requestId) {\n              crossfadeStartedRequestRef.current = requestId;\n              startCrossfade(outgoingPlayer, candidate as ReturnType<typeof createAudioPlayer>, requestId);\n            }\n            // Keep playbackIntentRef true until the user pauses/stops or a\n            // hard error/timeout. Clearing it on first confirm caused live\n            // streams to drop after ~1s when the next status said buffering.\n            if (startupTimeoutRef.current) {\n              clearTimeout(startupTimeoutRef.current);\n              startupTimeoutRef.current = null;\n            }\n            setPlaybackError(null);\n            setIsLoading(false);\n            setNativeMediaSession(lockScreenMetadata(radio), true);\n          } else if (\n            nativePlaybackConfirmed &&\n            status.playing === false &&\n            status.isBuffering !== true &&\n            !playbackIntentRef.current\n          ) {\n            setIsPlaying(false);\n            updateNativeMediaState(false);\n          } else if (\n            nativePlaybackConfirmed &&\n            status.isBuffering === true &&\n            playbackIntentRef.current\n          ) {\n            setIsPlaying(true);\n            setIsLoading(false);\n          }'''
          if old not in rp:
              raise SystemExit("radio-player listener pattern missing")
          Path("lib/radio-player.tsx").write_text(rp.replace(old, new))
          print("patched ok", Path("lib/radio-player.tsx").stat().st_size, Path("lib/player-utils.ts").stat().st_size)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/radio-player.tsx lib/player-utils.ts
          git commit -m "fix(player): restore radio-player + keep intent through live rebuffer" || echo "No changes"
          git push origin HEAD:main
